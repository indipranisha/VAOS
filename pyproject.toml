[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaos-cli"
version = "1.1.0"
description = "Standard-library terminal client for a local VAOS installation"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
vaos = "vaos_cli:main"

[tool.setuptools]
py-modules = ["vaos_cli"]
